name: snn-force
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.6
  - pip
  - pip:
    # PyTorch — swap index-url for your CUDA version if needed
    # CPU: https://download.pytorch.org/whl/cpu
    # CUDA 11.8: https://download.pytorch.org/whl/cu118
    # CUDA 12.1: https://download.pytorch.org/whl/cu121
    - torch==2.0.1
    - torchaudio==2.0.2
    - torchvision==0.15.2
    # Core scientific stack
    - numpy==1.26.4
    - pandas==2.1.2
    - scipy==1.11.3
    - scikit-learn==1.3.2
    - matplotlib==3.8.1
    - h5py==3.10.0
    - mat73==0.62
    - dill==0.3.8
    - seaborn==0.13.0
    - tabulate==0.9.0
    - dataframe-image==0.2.3
    - tensorboard==2.14.0
    # SNN / NIR
    - nir==0.2.0
    - nirtorch==0.2.1
    # Configuration & experiment tracking
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - wandb==0.18.7
    # Modelling extras
    - pytorch-tcn==1.2.3
    - torch-summary==1.4.5
    # Notebooks
    - jupyterlab
    - ipywidgets
    - ipympl
    # snntorch and neurobench are installed separately from the submodules
    # see README Installation section
